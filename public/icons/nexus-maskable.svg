<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NEXUS STREAM">
  <defs>
    <linearGradient id="nx-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="55%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BC13FE" />
    </linearGradient>
    <linearGradient id="nx-rail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#BC13FE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="nx-glow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.5" />
      <stop offset="65%" stop-color="#00F0FF" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#07080D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full-bleed void plate: safe-zone artwork only, no maskable clipping risk. -->
  <rect width="512" height="512" fill="#07080D" />
  <rect width="512" height="512" fill="url(#nx-glow)" />

  <g opacity="0.4">
    <g stroke="#00F0FF" stroke-opacity="0.12" stroke-width="2">
      <path d="M0 64 H512 M0 128 H512 M0 192 H512 M0 256 H512 M0 320 H512 M0 384 H512 M0 448 H512" />
      <path d="M64 0 V512 M128 0 V512 M192 0 V512 M256 0 V512 M320 0 V512 M384 0 V512 M448 0 V512" />
    </g>
  </g>

  <!-- Hexagon pushed inward so the 40% maskable safe circle never clips it. -->
  <path
    d="M256 96 L392 174 V330 L256 408 L120 330 V174 Z"
    fill="none"
    stroke="url(#nx-core)"
    stroke-width="12"
  />
  <path
    d="M256 122 L372 188 V316 L256 382 L140 316 V188 Z"
    fill="none"
    stroke="#00F0FF"
    stroke-opacity="0.22"
    stroke-width="4"
  />

  <path d="M296 166 L204 268 H250 L226 350 L334 240 H284 Z" fill="url(#nx-core)" />

  <g stroke="url(#nx-rail)" stroke-width="7" stroke-linecap="square" fill="none">
    <path d="M164 256 H196" />
    <path d="M316 256 H348" />
  </g>

  <circle cx="256" cy="256" r="12" fill="#07080D" stroke="#00F0FF" stroke-width="5" opacity="0.9" />
</svg>
